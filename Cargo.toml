[workspace]
resolver = "2"
members = [
  "crates/codex-core",
  "crates/codex-ingestion",
  "crates/codex-embedding",
  "crates/codex-storage",
  "crates/codex-evolution",
  "crates/codex-governance",
  "crates/codex-gpu",
  "crates/codex-vector",
  "crates/codex-api",
  "crates/codex-app",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["CODEX VERDANT contributors"]

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
