name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile workspace
        run: cargo check --workspace
      - name: Run tests
        run: cargo test --workspace
      - name: CLI smoke test
        shell: bash
        run: |
          output="$(cargo run -q -p codex-app)"
          printf '%s\n' "$output"
          grep -Fq "CODEX VERDANT v1.1.0" <<< "$output"
          grep -Fq "AXIOM-000: Do not prematurely destroy potentially useful information." <<< "$output"
          for component in codex-core codex-ingestion codex-embedding codex-storage codex-evolution codex-governance codex-gpu codex-vector codex-api; do
            grep -Fq -- "- $component v1.1.0 [scaffold only]" <<< "$output"
          done
